[package]
name = "supergloss-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "supergloss"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.44"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
fst = { version = "0.4.7", features = ["levenshtein"] }
lewton = "0.10.2"
libc = "0.2.191"
lzokay-native = { version = "0.2.1", default-features = false, features = ["decompress"] }
memmap2 = "0.9.12"
percent-encoding = "2.3.2"
ripemd = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
zip = { version = "9.7.1", default-features = false, features = ["deflate"] }

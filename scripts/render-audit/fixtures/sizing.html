<!-- What dictionaries set on the root: a 62.5% rem base, body margins and padding, fixed headers. -->
<style>
  html { font-size: 62.5%; }
  body { margin: 20px; padding: 12px; font-size: 1.6rem; }
  .hd { position: fixed; top: 0; left: 0; right: 0; background: #ffe; }
  .box { width: 100%; padding: 0 7px; border: 1px solid #ccc; } /* spills the gutter's 16px */
</style>
<div class="hd">a fixed header</div>
<p style="margin-top: 2em">Body text at 1.6rem.</p>
<div class="box">a box at width: 100% with padding and a border</div>
